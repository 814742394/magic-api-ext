name: Publish to Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: '发布渠道（default / beta / eap）'
        required: true
        default: 'default'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The IntelliJ Platform SDK is ~1.5 GB; reuse the same cache as the build job.
      - name: Cache IntelliJ Platform SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/9.8.2/transforms
          key: intellij-sdk-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            intellij-sdk-${{ runner.os }}-

      # `secrets` cannot be referenced in a step-level `if:` expression (GitHub
      # rejects the whole workflow as invalid), so signing is switched on with a
      # repository variable instead of a secret.
      # Set ENABLE_SIGNING=true in Settings -> Variables to turn it on.
      - name: Sign plugin
        if: ${{ vars.ENABLE_SIGNING == 'true' }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          printf '%s\n' "$CERTIFICATE_CHAIN" > chain.crt
          printf '%s\n' "$PRIVATE_KEY" > private.pem
          ./gradlew signPlugin --no-daemon \
            -Psigning.certificateChainFile=chain.crt \
            -Psigning.privateKeyFile=private.pem

      # Skip gracefully until PUBLISH_TOKEN exists in repository secrets,
      # so tagging a release does not show a red build for a missing token.
      - name: Check publish token
        id: token
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -n "$PUBLISH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PUBLISH_TOKEN 未配置，跳过 Marketplace 发布（GitHub Release 仍会由 Build 工作流创建）"
          fi

      - name: Publish
        if: steps.token.outputs.present == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon

      - name: Clean up signing material
        if: always()
        run: rm -f chain.crt private.pem
