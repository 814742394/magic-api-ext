name: Publish to Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: '发布渠道（default / beta / eap）'
        required: true
        default: 'default'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      # Optional: sign the archive when the certificate secrets are configured.
      - name: Sign plugin
        if: ${{ secrets.CERTIFICATE_CHAIN != '' }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          echo "$CERTIFICATE_CHAIN" > chain.crt
          echo "$PRIVATE_KEY" > private.pem
          ./gradlew signPlugin --no-daemon \
            -Psigning.certificateChainFile=chain.crt \
            -Psigning.privateKeyFile=private.pem

      - name: Publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon

      - name: Clean up signing material
        if: always()
        run: rm -f chain.crt private.pem
