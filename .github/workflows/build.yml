name: Build

on:
  push:
    branches: [main]
    # Tags drive the release: `git tag v0.1.5 && git push origin v0.1.5`
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Creating a Release needs write access to repository contents. The default
# GITHUB_TOKEN is read-only in this repository, which surfaces as
# "Resource not accessible by integration" (403) when publishing the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The IntelliJ Platform SDK is ~1.5 GB. Caching it keeps subsequent builds
      # from re-downloading the whole IDE distribution on every run.
      - name: Cache IntelliJ Platform SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/9.8.2/transforms
          key: intellij-sdk-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            intellij-sdk-${{ runner.os }}-

      - name: Compile and run tests
        run: ./gradlew test --no-daemon
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.socketTimeout=180000
            -Dorg.gradle.internal.http.connectionTimeout=180000
            -Dorg.gradle.internal.repository.max.retries=5

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-api-idea-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      # Pushing a `v*` tag (e.g. `git tag v0.1.4 && git push origin v0.1.4`)
      # publishes a GitHub Release with the plugin zip attached.
      # `GITHUB_TOKEN` is provided by Actions, so no personal token is needed.
      - name: Read plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          VERSION=$(grep -E '^pluginVersion=' gradle.properties | cut -d= -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "plugin version: $VERSION"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Magic API ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: build/distributions/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装

            1. 下载下方 `magic-api-idea-${{ steps.version.outputs.value }}.zip`
            2. IDEA 中打开 *Settings → Plugins → ⚙️ → Install Plugin from Disk…*
            3. 选择下载的 zip，重启 IDE

            插件 ID：`org.ssssssss.magicapi.idea`　要求 IDEA 2026.1+
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
