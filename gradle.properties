org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.parallel=true

pluginGroup=org.ssssssss.magicapi.idea
pluginName=Magic API
pluginVersion=0.1.4

# Optional: local IntelliJ IDEA installation used as the compile/test SDK.
# Leave it commented out to let Gradle download IntelliJ IDEA Community 2026.1
# (that download is several hundred MB and needs network access).
# macOS:
#   ideaPath=/Applications/IntelliJ IDEA.app
# Windows:
#   ideaPath=C:\\Users\\<you>\\AppData\\Local\\JetBrains\\Toolbox\\apps\\IDEA-U\\ch-0\\261.xxxx
# Or pass it per build: ./gradlew buildPlugin -PideaPath="..."
# ideaPath=
